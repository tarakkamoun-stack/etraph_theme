# A placer dans .github/workflows/build-image.yml du depot etraph/etraph_theme une fois cree.
# Construit l'image Docker ERPNext custom (erpnext + hrms + etraph_theme) et la pousse sur
# ghcr.io/tarakkamoun-stack/erpnext-etraph — build fait par GitHub Actions (isole, aucune charge sur les
# VPS de prod), conformement a la recommandation du plan d'architecture (ne jamais builder
# l'image sur le VPS cible : le build esbuild peut saturer sa memoire).
#
# Verifie le 29/08/2026 contre docs/02-setup/02-build-setup.md du depot frappe/frappe_docker.
# Premiere execution a surveiller : la syntaxe exacte de `secret-files` peut varier selon la
# version de docker/build-push-action — ajuster si le job echoue sur cette etape.
name: Build ERPNext ETRAPH image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout etraph_theme
        uses: actions/checkout@v4
        with:
          path: etraph_theme

      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main
          path: frappe_docker

      - name: Preparer apps.json
        run: cp etraph_theme/apps.json frappe_docker/apps.json

      - name: Se connecter a GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build et push de l'image
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          no-cache: true
          tags: ghcr.io/tarakkamoun-stack/erpnext-etraph:v16
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          secret-files: |
            apps_json=frappe_docker/apps.json
